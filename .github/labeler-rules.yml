# Aturan label otomatis (dipakai .github/workflows/labeler.yml, actions/labeler v5; file ini bernama labeler-rules.yml)
coins:
  - changed-files:
      - any-glob-to-any-file: ["coins/**"]

core:
  - changed-files:
      - any-glob-to-any-file: ["mining.sh", "config.sh", "lib/**"]

tools:
  - changed-files:
      - any-glob-to-any-file: ["tools/**", "tests/**"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".shellcheckrc", ".markdownlint-cli2.jsonc"]
