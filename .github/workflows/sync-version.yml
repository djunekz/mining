name: sync-version

on:
  push:
    branches:
      - main
    paths:
      - "unmineable/constants.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sinkronkan versi di dokumen
        run: python3 scripts/sync_version.py

      - name: Commit bila ada perubahan
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: sinkronkan versi dengan constants.py"
            git push
          else
            echo "Sudah sinkron, tidak ada yang di-commit."
          fi
