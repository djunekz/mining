name: auto-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validasi sintaks
        run: |
          python -m compileall -q unmineable
          bash -n unmineable.sh
          bash -n install.sh

      - name: Cek versi terhadap tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' unmineable/constants.py)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::warning::Tag ${TAG} tidak sama dengan VERSION v${VERSION} di constants.py"
          fi

      - name: Bangun aset rilis
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="unmineable-${TAG}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" "${TAG}"
          git archive --format=zip --prefix="${NAME}/" -o "dist/${NAME}.zip" "${TAG}"
          cd dist
          sha256sum "${NAME}.tar.gz" "${NAME}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Buat atau perbarui release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES='Pasang di Termux: unduh arsip, ekstrak, jalankan `bash install.sh` lalu pilih install dari lokal. Atau jalankan install.sh dan pilih install dari release.'
          FLAGS=""
          case "$TAG" in
            *-*) FLAGS="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "unMineable Termux Miner ${TAG}" --notes "$NOTES" --generate-notes --verify-tag $FLAGS
          fi
