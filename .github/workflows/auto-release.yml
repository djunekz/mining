name: auto-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validasi sintaks
        run: |
          python -m compileall -q unmineable
          bash -n unmineable.sh
          bash -n install.sh

      - name: Cek versi terhadap tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CODE_VERSION="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' unmineable/constants.py)"
          if [ "${CODE_VERSION}" != "${VERSION}" ]; then
            echo "::error::Tag ${TAG} tidak sama dengan VERSION ${CODE_VERSION} di unmineable/constants.py"
            exit 1
          fi

      - name: Ambil catatan rilis dari CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="${VERSION}" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Tidak ada catatan untuk versi ${VERSION} di CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Bangun aset rilis
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="unmineable-${TAG}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" "${TAG}"
          git archive --format=zip --prefix="${NAME}/" -o "dist/${NAME}.zip" "${TAG}"
          cd dist
          sha256sum "${NAME}.tar.gz" "${NAME}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Buat atau perbarui release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TITLE="unMineable v${VERSION}"
          FLAGS=""
          case "${VERSION}" in
            *-*) FLAGS="--prerelease" ;;
          esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file notes.md
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "${TITLE}" --notes-file notes.md --verify-tag ${FLAGS}
          fi
