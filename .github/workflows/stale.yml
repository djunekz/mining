name: Stale

# Menandai lalu menutup issue/PR yang tidak aktif.
on:
  schedule:
    - cron: "30 1 * * *" # tiap hari 08:30 WIB
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Tandai issue/PR tidak aktif
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,bug,help wanted"
          exempt-pr-labels: "pinned,security,work-in-progress"
          stale-issue-message: >
            Issue ini tidak ada aktivitas selama 45 hari, jadi ditandai **stale**.
            Beri komentar jika masih relevan; jika tidak, akan ditutup dalam 14 hari.
          stale-pr-message: >
            PR ini tidak ada aktivitas selama 45 hari, jadi ditandai **stale**.
            Perbarui atau beri komentar jika masih dikerjakan; jika tidak, akan ditutup dalam 14 hari.
          close-issue-message: "Ditutup karena tidak ada aktivitas. Buka kembali kapan saja jika masih perlu."
          close-pr-message: "Ditutup karena tidak ada aktivitas. Silakan buka kembali bila dilanjutkan."
