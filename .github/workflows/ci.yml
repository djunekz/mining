name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # tiap Senin 10:00 WIB, deteksi perubahan di runner
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Sintaks & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: bash -n (cek sintaks)
        run: |
          fail=0
          for f in mining.sh config.sh lib/*.sh tools/*.sh tests/*.sh coins/*.sh; do
            if ! bash -n "$f"; then echo "::error file=$f::sintaks salah"; fail=1; fi
          done
          exit $fail

      - name: ShellCheck
        run: shellcheck -x -S warning mining.sh config.sh lib/*.sh tools/*.sh tests/*.sh

  coins:
    name: Validasi koin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check-coins
        run: |
          bash tools/check-coins.sh
          bash tools/check-coins.sh --summary | sed '/^---$/,$d' >> "$GITHUB_STEP_SUMMARY"

  version:
    name: Format VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: VERSION harus semver X.Y.Z
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::'$v' bukan semver X.Y.Z"; exit 1
          fi
          echo "VERSION = $v"

  smoke:
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Versi bash
        run: bash --version | head -1
      - name: tests/smoke.sh
        run: bash tests/smoke.sh

  ok:
    name: CI OK
    if: always()
    needs: [syntax, coins, version, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Semua job harus sukses
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Hasil: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
