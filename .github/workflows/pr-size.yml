name: Ukuran PR

# Memberi label size/XS ... size/XL berdasarkan jumlah baris yang berubah.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  size:
    name: Hitung ukuran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            const sizes = [
              ['size/XS', 10, '3fb950'],
              ['size/S', 50, '7ee787'],
              ['size/M', 250, 'e3b341'],
              ['size/L', 1000, 'f0883e'],
              ['size/XL', Infinity, 'f85149'],
            ];
            const [name, , color] = sizes.find(([, max]) => changed <= max);

            // pastikan label ada
            try {
              await github.rest.issues.createLabel({
                ...context.repo, name, color,
                description: `PR dengan ${changed} baris berubah`,
              });
            } catch (e) { if (e.status !== 422) throw e; }

            // lepas label size/* lain, pasang yang baru
            const current = pr.labels.map(l => l.name);
            for (const l of current.filter(n => n.startsWith('size/') && n !== name)) {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: l });
            }
            if (!current.includes(name)) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [name] });
            }
            core.info(`${changed} baris berubah -> ${name}`);
