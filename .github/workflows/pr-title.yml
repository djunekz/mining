name: Judul PR

# Judul PR menjadi pesan commit (squash), dan pesan commit menjadi CHANGELOG.
# Jadi judul harus mengikuti Conventional Commits.
# Memakai pull_request_target agar bisa berjalan di PR dari fork; workflow ini
# TIDAK me-checkout kode PR, hanya membaca judulnya.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    name: Periksa format judul
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const re = /^(feat|fix|perf|refactor|revert|docs|ci|build|chore|test|style)(\([a-z0-9._\/-]+\))?!?: .{3,}$/;
            if (re.test(title)) {
              core.info(`Judul OK: ${title}`);
              return;
            }
            core.setFailed(
              `Judul PR "${title}" tidak sesuai Conventional Commits.\n` +
              `Format: tipe(lingkup opsional): deskripsi\n` +
              `Tipe: feat, fix, perf, refactor, revert, docs, ci, build, chore, test, style\n` +
              `Contoh: feat(coins): tambah koin ABC   |   fix(miner): perbaiki thread default`
            );
