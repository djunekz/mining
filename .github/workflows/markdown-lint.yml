name: Markdown Lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc"]

permissions:
  contents: read

concurrency:
  group: mdlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.14.0 "**/*.md" "#node_modules"
