name: Daftar Koin

# Membuat ulang docs/COINS.md otomatis tiap folder coins/ berubah.
on:
  push:
    branches: [main]
    paths:
      - "coins/**"
      - "tools/gen-coins-md.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  coins-doc:
    name: Perbarui docs/COINS.md
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Jika main dilindungi ruleset, isi secret RELEASE_TOKEN (lihat docs/AUTOMATION.md).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Generate
        run: bash tools/gen-coins-md.sh

      - name: Commit jika berubah
        run: |
          if git diff --quiet -- docs/COINS.md; then
            echo "docs/COINS.md sudah terbaru."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COINS.md
          git commit -m "docs(coins): update daftar koin [skip ci] [skip changelog]"
          git push origin HEAD:main || {
            echo "::error::Push ke main ditolak (ruleset/branch protection). Isi secret RELEASE_TOKEN, lihat docs/AUTOMATION.md."
            exit 1
          }
