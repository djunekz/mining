name: Changelog

# Memperbarui blok [Unreleased] di CHANGELOG.md dari pesan commit
# (Conventional Commits).
# Saat auto release aktif (bawaan), workflow Release sudah menulis CHANGELOG.md
# sendiri, jadi job ini hanya jalan untuk push ke main bila Repository variable
# AUTO_RELEASE = false. Lewat tombol "Run workflow" selalu jalan.
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Perbarui CHANGELOG.md
    if: ${{ !github.event.repository.fork && (github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE == 'false') }}
    # Antrean bersama dengan release/coins-doc supaya push ke main tidak bertabrakan.
    # Dipasang di tingkat job: bila job dilewati, antrean tidak ikut terpakai
    # (antrean tingkat workflow membuat run Release terbatalkan).
    concurrency:
      group: repo-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          # Jika main dilindungi ruleset (wajib PR / wajib status check), github-actions[bot]
          # tidak bisa push. Isi secret RELEASE_TOKEN (lihat docs/AUTOMATION.md).
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Generate blok [Unreleased]
        run: bash tools/changelog.sh unreleased

      - name: Commit jika berubah
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md sudah terbaru."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update [skip ci]"
          git push origin HEAD:main || {
            echo "::error::Push ke main ditolak (ruleset/branch protection). Isi secret RELEASE_TOKEN, lihat docs/AUTOMATION.md."
            exit 1
          }
