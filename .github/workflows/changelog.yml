name: Changelog

# Memperbarui blok [Unreleased] di CHANGELOG.md dari pesan commit
# (Conventional Commits) setiap ada push ke main.
on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

# Satu antrean bersama dengan release/coins-doc supaya push ke main tidak bertabrakan.
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  changelog:
    name: Perbarui CHANGELOG.md
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Generate blok [Unreleased]
        run: bash tools/changelog.sh unreleased

      - name: Commit jika berubah
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md sudah terbaru."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update [skip ci]"
          git push origin HEAD:main
