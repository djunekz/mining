version: 2
updates:
  # Menjaga versi actions di .github/workflows/ tetap terbaru
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns: ["*"]
