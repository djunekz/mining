name: Laporan bug
description: Ada yang tidak berjalan sesuai harapan
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor! Isi sedetail mungkin supaya bug mudah direproduksi.

        **Jangan** menempelkan alamat wallet, password, atau data pribadi lain di laporan ini.
  - type: input
    id: version
    attributes:
      label: Versi MINING
      description: Lihat di menu **About** atau isi file `VERSION`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bagian yang bermasalah
      options:
        - Menu / tampilan
        - Login & registrasi
        - Wallet
        - Mining (menjalankan miner)
        - Update
        - Koin tertentu
        - Lainnya
    validations:
      required: true
  - type: input
    id: coin
    attributes:
      label: Koin (jika terkait)
      placeholder: "XMR"
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah untuk mengulang
      placeholder: |
        1. Jalankan `bash mining.sh`
        2. Pilih 1. Mining
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Yang seharusnya terjadi
  - type: textarea
    id: env
    attributes:
      label: Lingkungan
      value: |
        - Android:
        - Termux (F-Droid / lainnya):
        - Perangkat / chipset:
        - bash (`bash --version | head -1`):
        - Miner & versinya (`xmrig --version`):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / pesan error
      description: Salin teks error (bukan screenshot jika bisa).
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Sebelum mengirim
      options:
        - label: Saya sudah mencari issue serupa dan belum menemukannya.
          required: true
        - label: Laporan ini tidak memuat wallet, password, atau data pribadi.
          required: true
